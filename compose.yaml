x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  restart: unless-stopped
  depends_on:
    kafka-volume-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 12
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

services:
  kafka-volume-init:
    image: apache/kafka:4.3.1
    user: "0:0"
    restart: "no"
    entrypoint:
      - /bin/bash
      - -ec
      - chown 1000:1000 /data/kafka-1 /data/kafka-2 /data/kafka-3
    volumes:
      - kafka-1-data:/data/kafka-1
      - kafka-2-data:/data/kafka-2
      - kafka-3-data:/data/kafka-3

  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
    volumes:
      - kafka-1-data:/tmp/kraft-combined-logs

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9093
    volumes:
      - kafka-2-data:/tmp/kraft-combined-logs

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9094
    volumes:
      - kafka-3-data:/tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        create_topic() {
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka-1:19092,kafka-2:19092,kafka-3:19092 \
            --create \
            --if-not-exists \
            --topic "$1" \
            --partitions "$2" \
            --replication-factor 3 \
            --config min.insync.replicas=2
        }

        create_topic "${KAFKA_TOPIC:-jobs-load-test}" "${KAFKA_PARTITIONS:-12}"
        create_topic "${KAFKA_INPUT_TOPIC:-jobs-input}" 1
        create_topic "${KAFKA_OUTPUT_TOPIC:-jobs-output}" 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:19092,kafka-2:19092,kafka-3:19092 \
          --list

  kafka-load:
    image: apache/kafka:4.3.1
    profiles: ["load"]
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-jobs-load-test}
      KAFKA_NUM_RECORDS: ${KAFKA_NUM_RECORDS:-100000}
      KAFKA_RECORD_SIZE: ${KAFKA_RECORD_SIZE:-1024}
      KAFKA_THROUGHPUT: ${KAFKA_THROUGHPUT:--1}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-producer-perf-test.sh \
          --topic "$${KAFKA_TOPIC}" \
          --num-records "$${KAFKA_NUM_RECORDS}" \
          --record-size "$${KAFKA_RECORD_SIZE}" \
          --throughput "$${KAFKA_THROUGHPUT}" \
          --bootstrap-server kafka-1:19092,kafka-2:19092,kafka-3:19092 \
          --command-property \
            acks=all \
            enable.idempotence=true

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DYNAMIC_CONFIG_ENABLED: "false"

  jobsoperator:
    image: jobsoperator
    build:
      context: .
      dockerfile: JobsOperator/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      JOB_MODE: kafka-relay
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-jobs-input}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-jobs-output}
      KAFKA_CHECKPOINT_PATH: /app/checkpoints/kafka-relay.json
    volumes:
      - jobsoperator-checkpoints:/app/checkpoints

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  jobsoperator-checkpoints:
